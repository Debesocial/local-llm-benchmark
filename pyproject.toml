[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-benchmark"
dynamic = ["version"]
description = "Zero-dependency load testing and concurrency benchmark for LLM inference engines and OpenAI-compatible APIs."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "biiproject" }]
keywords = ["llm", "benchmark", "load-testing", "vllm", "openai", "ttft", "latency", "inference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Benchmark",
]
dependencies = []

[project.scripts]
llm-benchmark = "llmload:cli"
llm-benchmark-mock = "mock_llm:cli"

[tool.setuptools]
py-modules = ["llmload", "llmload_lang", "mock_llm"]

[tool.setuptools.dynamic]
version = { attr = "llmload.TOOL_VERSION" }
